name: Publish on maven

on:
  release:
    types: published
  workflow_dispatch:

concurrency:
  group: publish-mod-maven-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    name: "Build mod jars"
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      CCM_BUILD: true
      CCM_USER: ${{ secrets.CCM_USER }}
      CCM_PASS: ${{ secrets.CCM_PASS }}
    strategy:
      matrix:
        # Use these Java versions
        java: [
          21,    # Current Java LTS
        ]
        loader: [
          common,
          fabric,
          neoforge,
        ]
    steps:
      - name: Setup workspace
        uses: actions/checkout@v7

      - name: Setup jdk ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'

      - name: Validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Setup gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build
        env:
          LOADER: ${{ matrix.loader }}
        run: ./gradlew :${{matrix.loader}}:build

      - name: Publish on Cobbled Creators Maven
        env:
          LOADER: ${{ matrix.loader }}
        run: ./gradlew :${{ matrix.loader }}:publish
